name = "mathwordle"
main = "src/worker.js"
compatibility_date = "2024-09-01"

# 静态资源：构建产物 dist/ 由 assets 绑定提供，未匹配路径回退到 index.html（SPA）
assets = { directory = "./dist", not_found_handling = "single-page-application", binding = "ASSETS" }

[[d1_databases]]
binding = "DB"
database_name = "mathwordle"
database_id = "5d3568ec-309c-48c8-9f13-3a3e47aaeec2"

# 自定义路由：wordle.yuer6327.top 的流量都交给这个 Worker
[[routes]]
pattern = "wordle.yuer6327.top/*"
zone_id = "a7aa2aef32198c741273fe14173ebb59"

# 每日 UTC 18:00（北京 02:00）清理过期数据，处理函数见 src/worker.js 的 scheduled
# 保留期可用 CLEANUP_HINT_DAYS / CLEANUP_RECORD_DAYS / CLEANUP_MAX_BATCHES 覆盖（wrangler secret 或 [vars]）
[triggers]
crons = ["0 18 * * *"]

# 本地开发: npx wrangler dev
# 部署: npm run build && wrangler deploy

# 统一认证库（auth.yuer6327.top 同一个 D1）：登录/注册在 auth 平台完成，
# 本 Worker 只校验共享 cookie 会话（见 functions/api/_lib/response.js 的 requireAuth）
[[d1_databases]]
binding = "AUTH_DB"
database_name = "auth-db"
database_id = "85b7d1cc-fbb4-4ffe-8f1e-b6690c193a1f"

# 统一认证 OAuth 客户端（授权码模式示范；secret 走 wrangler secret put OAUTH_CLIENT_SECRET）
[vars]
OAUTH_CLIENT_ID = "ac_88a682c75b745238"
